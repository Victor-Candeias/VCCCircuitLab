[project]
name = "vcccircuitlab-api"
version = "0.1.0"
description = "API Python do VCCCircuitLab (geração, validação e simulação de circuitos)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_auth: usa a autenticação real em vez do utilizador falso do conftest"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, naming, pytest-style
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "PT"]

[tool.ruff.format]
quote-style = "double"
