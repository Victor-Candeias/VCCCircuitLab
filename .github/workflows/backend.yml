name: Backend CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check apps/api

      - name: Format check (ruff format)
        run: ruff format apps/api --check

      - name: Test
        run: pytest apps/api
