name: E2E (browsers e tablets)

# E5-06: testes Playwright contra a API real (MongoDB efémero) em Chromium, Firefox, WebKit e
# tablets com toque (ver apps/web/playwright.config.ts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (desktop e tablet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          # Credenciais de um container descartável, só acessível dentro do runner.
          MONGO_INITDB_ROOT_USERNAME: e2e
          MONGO_INITDB_ROOT_PASSWORD: e2e-ci-only
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_HOST: 127.0.0.1
      MONGODB_PORT: '27017'
      MONGODB_DATABASE: VCCCircuitLab
      MONGODB_USERNAME: e2e
      MONGODB_PASSWORD: e2e-ci-only
      MONGODB_AUTH_SOURCE: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ">=20"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements.txt

      - name: Generate data encryption key
        run: |
          key=$(apps/api/.venv/bin/python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "::add-mask::$key"
          echo "DATA_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Seed component templates
        working-directory: apps/api
        run: .venv/bin/python -m app.component_templates.seed ../../packages/circuit-schema/test/fixtures/catalog.json

      - name: Install Playwright browsers
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: pnpm --filter ./apps/web test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
